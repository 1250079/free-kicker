
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KENYA PRO FREE KICK</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08141c;color:white;font-family:Arial,"Noto Sans JP",sans-serif}
header{text-align:center;padding:17px;background:#10242f;border-bottom:2px solid #d62c3c}
h1{margin:0;font-size:clamp(22px,5vw,34px);letter-spacing:2px}
header p{margin:7px 0 0;color:#b8cbd3;font-size:12px}
main{max-width:1000px;margin:auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat,.panel{background:#112630;border:1px solid #304b57;border-radius:12px;padding:12px}
.stat{text-align:center}
.stat span{display:block;font-size:11px;color:#b3c5ce}
.stat strong{display:block;font-size:24px;margin-top:4px}
canvas{display:block;width:100%;height:auto;border-radius:12px;border:1px solid #385664;touch-action:manipulation}
.hint{font-size:12px;color:#b8cbd3;line-height:1.6}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;justify-content:space-between;font-size:14px;gap:8px}
input{width:100%;accent-color:#49e39a;margin:14px 0 5px}
.small{font-size:11px;color:#b3c5ce;line-height:1.5}
.actions{display:flex;gap:10px;margin-top:10px}
button{border:0;border-radius:10px;padding:15px;font-size:15px;font-weight:bold;cursor:pointer}
#shoot{flex:2;background:#4be49a;color:#052519}
#reset{flex:1;background:#29414e;color:white}
button:disabled{opacity:.5}
#message{text-align:center;margin-top:10px;padding:13px;background:#112630;border:1px solid #304b57;border-radius:10px;font-weight:bold}
footer{text-align:center;color:#7895a4;font-size:11px;padding:18px}
@media(max-width:520px){.controls{grid-template-columns:1fr}.stat{padding:8px 3px}.stat strong{font-size:20px}}
</style>
</head>
<body>
<header>
  <h1>🇰🇪 KENYA PRO FREE KICK</h1>
  <p>FREE KICK CHALLENGE · NATIONAL TEAM INSPIRED EDITION</p>
</header>
<main>
  <section class="stats">
    <div class="stat"><span>GOALS ⚽</span><strong id="goals">0</strong></div>
    <div class="stat"><span>SHOTS</span><strong id="shots">0</strong></div>
    <div class="stat"><span>SUCCESS RATE</span><strong id="accuracy">0%</strong></div>
  </section>

  <canvas id="game" width="900" height="600"></canvas>
  <p class="hint">🎯 ゴールをタップして狙う場所を決めよう。パワーとカーブを調整して「シュート」！キーパーのモジャモジャヘアにも注目！</p>

  <section class="controls">
    <div class="panel">
      <label for="power">💥 パワー <strong id="powerVal">75%</strong></label>
      <input id="power" type="range" min="30" max="100" value="75">
      <div class="small">強いほど速いシュート。パワーが高いと狙いがぶれやすい。</div>
    </div>
    <div class="panel">
      <label for="curve">🌀 カーブ <strong id="curveVal">0</strong></label>
      <input id="curve" type="range" min="-100" max="100" value="0">
      <div class="small">マイナスは左、プラスは右に曲がる。</div>
    </div>
  </section>
  <div class="actions">
    <button id="shoot">⚽ シュート！</button>
    <button id="reset">↻ リセット</button>
  </div>
  <div id="message" aria-live="polite">狙う場所を選んでシュートしよう！</div>
</main>
<footer>KENYA PRO FREE KICK · Browser Game</footer>

<script>
(() => {
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=900,H=600;
const $=id=>document.getElementById(id);
const power=$("power"),curve=$("curve"),shootBtn=$("shoot");

let goals=0,shots=0;
let aim={x:450,y:205};
let ball=null;
let keeper={x:450,target:450,dive:0};
let particles=[];
let elapsed=0,last=0;
let messageTimer=0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function say(s){$("message").textContent=s}
function stats(){
  $("goals").textContent=goals;
  $("shots").textContent=shots;
  $("accuracy").textContent=shots?Math.round(goals/shots*100)+"%":"0%";
}
function rounded(x,y,w,h,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function pitch(){
  const sky=ctx.createLinearGradient(0,0,0,260);
  sky.addColorStop(0,"#91d4ed");
  sky.addColorStop(1,"#d9eef0");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // 遠くの観客席
  ctx.fillStyle="#445b65";ctx.fillRect(0,100,W,104);
  for(let row=0;row<5;row++){
    for(let i=0;i<75;i++){
      const colors=["#e7e8d7","#e5ba55","#c94c47","#263f4d","#a9c8cf"];
      ctx.fillStyle=colors[(i*3+row*7)%colors.length];
      ctx.fillRect(i*13,110+row*17,8,9);
    }
  }

  // 芝生
  ctx.fillStyle="#17673e";
  ctx.beginPath();ctx.moveTo(0,190);ctx.lineTo(900,190);
  ctx.lineTo(900,600);ctx.lineTo(0,600);ctx.fill();

  for(let i=0;i<8;i++){
    ctx.fillStyle=i%2?"#1a7142":"#217c49";
    const y=190+i*52;
    ctx.fillRect(0,y,900,Math.min(52,600-y));
  }

  ctx.strokeStyle="rgba(255,255,255,.72)";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(65,600);ctx.lineTo(245,190);
  ctx.moveTo(835,600);ctx.lineTo(655,190);
  ctx.moveTo(0,505);ctx.lineTo(900,505);
  ctx.moveTo(250,190);ctx.lineTo(250,273);
  ctx.lineTo(650,273);ctx.lineTo(650,190);
  ctx.stroke();

  // ゴールの影
  ctx.fillStyle="rgba(0,0,0,.20)";
  ctx.beginPath();ctx.ellipse(450,250,220,22,0,0,Math.PI*2);ctx.fill();

  // ネット
  ctx.fillStyle="rgba(248,252,255,.17)";
  ctx.fillRect(280,145,340,105);
  ctx.strokeStyle="rgba(255,255,255,.72)";ctx.lineWidth=1.3;
  for(let x=290;x<620;x+=16){
    ctx.beginPath();ctx.moveTo(x,147);ctx.lineTo(x,248);ctx.stroke();
  }
  for(let y=158;y<250;y+=14){
    ctx.beginPath();ctx.moveTo(282,y);ctx.lineTo(618,y);ctx.stroke();
  }
  ctx.strokeStyle="#fff";ctx.lineWidth=8;
  ctx.strokeRect(280,145,340,105);

  // ターゲットエリア
  if(!ball){
    ctx.save();
    ctx.strokeStyle="rgba(255,233,103,.75)";
    ctx.lineWidth=2;
    ctx.setLineDash([5,6]);
    ctx.strokeRect(288,153,324,89);
    ctx.restore();
  }
}

function drawAim(){
  if(ball)return;
  ctx.save();
  ctx.strokeStyle="#ffe76b";
  ctx.lineWidth=2;
  ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(450,500);ctx.lineTo(aim.x,aim.y);ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(aim.x,aim.y,12,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(aim.x-18,aim.y);ctx.lineTo(aim.x+18,aim.y);
  ctx.moveTo(aim.x,aim.y-18);ctx.lineTo(aim.x,aim.y+18);ctx.stroke();
  ctx.fillStyle="#fff29a";ctx.font="bold 13px Arial";
  ctx.fillText("AIM",aim.x+16,aim.y-13);
  ctx.restore();
}

function drawWall(){
  for(let i=0;i<4;i++){
    const x=378+i*42,y=363;
    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.beginPath();ctx.ellipse(x,y+20,16,5,0,0,Math.PI*2);ctx.fill();

    // 足
    ctx.strokeStyle="#202a31";ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(x-5,y+8);ctx.lineTo(x-8,y+21);
    ctx.moveTo(x+5,y+8);ctx.lineTo(x+8,y+21);ctx.stroke();

    // ケニアカラーの壁の選手
    rounded(x-12,y-6,24,26,4,i%2?"#c92436":"#11191f");
    ctx.fillStyle="#168747";
    ctx.fillRect(x-11,y+5,22,5);
    ctx.fillStyle="#fff";
    ctx.fillRect(x-10,y-1,20,2);

    ctx.fillStyle="#895c43";
    ctx.beginPath();ctx.arc(x,y-17,10,0,Math.PI*2);ctx.fill();

    // 髪
    ctx.fillStyle="#171515";
    ctx.beginPath();ctx.arc(x,y-21,11,Math.PI,Math.PI*2);ctx.fill();
    for(let k=0;k<7;k++){
      const a=Math.PI+(k/6)*Math.PI;
      ctx.beginPath();
      ctx.arc(x+Math.cos(a)*8,y-23+Math.sin(a)*7,4,0,Math.PI*2);
      ctx.fill();
    }
  }
}

// キーパーのアフロヘア
function drawKeeper(){
  const x=keeper.x;
  const y=222;
  const dive=keeper.dive;
  const reach=ball&&ball.t>.72 ? Math.sin(Math.PI*clamp((ball.t-.72)/.28,0,1))*dive : 0;

  ctx.save();
  ctx.translate(x,y+Math.abs(reach)*8);
  ctx.rotate(reach*.5);

  // 影
  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.beginPath();ctx.ellipse(0,34,36,9,0,0,Math.PI*2);ctx.fill();

  // 脚
  ctx.strokeStyle="#17242e";ctx.lineWidth=12;ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(-8,17);ctx.lineTo(-18,39);
  ctx.moveTo(8,17);ctx.lineTo(18,39);ctx.stroke();

  // ソックス
  ctx.strokeStyle="#f4f4f4";ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(-18,31);ctx.lineTo(-20,40);
  ctx.moveTo(18,31);ctx.lineTo(20,40);ctx.stroke();

  // 腕
  ctx.strokeStyle="#a96f4d";ctx.lineWidth=10;
  ctx.beginPath();
  ctx.moveTo(-14,-6);ctx.lineTo(-32,-19);
  ctx.moveTo(14,-6);ctx.lineTo(32,-19);ctx.stroke();

  // 黄色いキーパーグローブ
  ctx.fillStyle="#f4e75b";
  ctx.beginPath();ctx.arc(-34,-21,9,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(34,-21,9,0,Math.PI*2);ctx.fill();

  // 胴体
  rounded(-19,-15,38,37,8,"#f0c52e");
  ctx.fillStyle="#111a20";
  ctx.fillRect(-19,-3,38,5);
  ctx.fillStyle="#c9273a";
  ctx.fillRect(-19,4,38,5);
  ctx.fillStyle="#168748";
  ctx.fillRect(-19,13,38,6);

  // 首
  ctx.fillStyle="#986342";ctx.fillRect(-6,-29,12,13);

  // 顔
  ctx.fillStyle="#9a684a";
  ctx.beginPath();ctx.ellipse(0,-35,14,16,0,0,Math.PI*2);ctx.fill();

  // 耳
  ctx.beginPath();ctx.arc(-13,-36,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(13,-36,4,0,Math.PI*2);ctx.fill();

  // もじゃもじゃアフロの大きな輪郭
  ctx.fillStyle="#171313";
  ctx.beginPath();ctx.arc(0,-45,19,0,Math.PI*2);ctx.fill();

  // カールを重ねて毛先をふわふわに
  const curls=[
    [-15,-49,7],[-10,-57,7],[-2,-61,7],[7,-59,7],
    [15,-53,7],[18,-44,7],[15,-38,6],
    [-17,-41,7],[-11,-48,7],[-5,-53,7],
    [3,-54,7],[11,-48,7],[12,-40,6],
    [-9,-39,6],[-1,-42,7],[6,-40,6],
    [-15,-55,5],[4,-63,5],[14,-57,5]
  ];
  for(const [cx,cy,r] of curls){
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  }

  // 顔を見せるための眉・目
  ctx.strokeStyle="#281b16";ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-8,-37);ctx.lineTo(-3,-38);
  ctx.moveTo(3,-38);ctx.lineTo(8,-37);ctx.stroke();

  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(-5,-34,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(5,-34,2,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#211712";
  ctx.beginPath();ctx.arc(-5,-34,1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(5,-34,1,0,Math.PI*2);ctx.fill();

  // 口
  ctx.strokeStyle="#5d352b";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-4,-26);ctx.quadraticCurveTo(0,-24,4,-26);ctx.stroke();

  ctx.restore();
}

// ケニア国旗カラーの選手
function drawKicker(){
  const t=ball?ball.t:0;
  const swing=ball&&t<.26?Math.sin(Math.PI*t/.26):0;
  const follow=ball&&t>=.26&&t<.52?1-(t-.26)/.26:0;

  ctx.save();
  ctx.translate(390,474);
  ctx.rotate(-.08*swing);

  // 影
  ctx.fillStyle="rgba(0,0,0,.23)";
  ctx.beginPath();ctx.ellipse(0,27,31,8,0,0,Math.PI*2);ctx.fill();

  // 後ろ脚
  ctx.strokeStyle="#171e25";ctx.lineWidth=12;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-8,1);ctx.lineTo(-14,23);ctx.stroke();

  // 蹴る脚
  ctx.save();ctx.translate(8,1);ctx.rotate(-.95*swing+.65*follow);
  ctx.strokeStyle="#875b43";ctx.lineWidth=12;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(5,17);ctx.stroke();
  ctx.strokeStyle="#f5f5f5";ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(5,13);ctx.lineTo(7,22);ctx.stroke();
  ctx.strokeStyle="#131b20";ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(7,22);ctx.lineTo(18,23);ctx.stroke();
  ctx.restore();

  // ユニフォーム
  ctx.fillStyle="#11191e";
  ctx.beginPath();
  ctx.moveTo(-17,-34);ctx.lineTo(16,-34);
  ctx.lineTo(20,1);ctx.lineTo(-17,1);ctx.closePath();ctx.fill();

  // 赤い中央パネル
  ctx.fillStyle="#c51f35";ctx.fillRect(-8,-33,16,33);

  // 緑の側面
  ctx.fillStyle="#168448";
  ctx.beginPath();ctx.moveTo(-16,-32);ctx.lineTo(-10,-32);
  ctx.lineTo(-10,0);ctx.lineTo(-15,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(10,-32);ctx.lineTo(16,-32);
  ctx.lineTo(19,0);ctx.lineTo(10,0);ctx.closePath();ctx.fill();

  // 白い縁取り
  ctx.strokeStyle="#fff";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-15,-28);ctx.lineTo(-18,-12);
  ctx.moveTo(15,-28);ctx.lineTo(18,-12);ctx.stroke();

  // 腕
  ctx.strokeStyle="#8b5a41";ctx.lineWidth=9;
  ctx.beginPath();
  ctx.moveTo(-15,-26);ctx.lineTo(-25,-9+swing*4);
  ctx.moveTo(14,-26);ctx.lineTo(24,-14-swing*6);
  ctx.stroke();

  // 首と頭
  ctx.fillStyle="#8b5a41";ctx.fillRect(-5,-41,10,10);
  ctx.fillStyle="#171313";
  ctx.beginPath();ctx.arc(0,-47,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#8b5a41";
  ctx.beginPath();ctx.ellipse(0,-45,10,12,0,0,Math.PI*2);ctx.fill();

  // 髪
  ctx.fillStyle="#171313";
  ctx.beginPath();ctx.arc(0,-51,12,Math.PI,Math.PI*2);ctx.fill();

  // 顔
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(4,-46,1.5,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

function drawBall(x,y,r,rotation=0){
  ctx.save();

  // 影
  ctx.fillStyle="rgba(0,0,0,.24)";
  ctx.beginPath();ctx.ellipse(x+5,y+r*.8,r*1.25,r*.42,0,0,Math.PI*2);ctx.fill();

  ctx.translate(x,y);ctx.rotate(rotation);

  const g=ctx.createRadialGradient(-r*.35,-r*.4,1,0,0,r*1.2);
  g.addColorStop(0,"#fff");g.addColorStop(1,"#cbd4d8");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#27323a";ctx.lineWidth=Math.max(1,r*.12);ctx.stroke();

  ctx.fillStyle="#222c34";
  ctx.beginPath();ctx.arc(0,0,r*.29,0,Math.PI*2);ctx.fill();
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*r*.65,Math.sin(a)*r*.65,r*.16,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function burst(x,y,color,count=40){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const speed=40+Math.random()*200;
    particles.push({
      x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
      life:.7+Math.random()*.9,
      r:2+Math.random()*4,color
    });
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  pitch();
  drawAim();
  drawWall();
  drawKeeper();
  drawKicker();

  if(ball){
    const t=clamp(ball.t,0,1);
    const x=lerp(450,ball.tx,t)+Math.sin(t*Math.PI)*ball.curve*.45;
    const y=lerp(500,ball.ty,t)-Math.sin(t*Math.PI)*ball.lift;
    const r=lerp(15,4,t);

    // シュートの残像
    for(let i=4;i>=1;i--){
      const old=clamp(t-i*.025,0,1);
      const ox=lerp(450,ball.tx,old)+Math.sin(old*Math.PI)*ball.curve*.45;
      const oy=lerp(500,ball.ty,old)-Math.sin(old*Math.PI)*ball.lift;
      ctx.globalAlpha=.08*(5-i);
      ctx.fillStyle="#fff";
      ctx.beginPath();ctx.arc(ox,oy,r*(1-i*.12),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    drawBall(x,y,r,t*25);
  }else{
    drawBall(450,500,15,elapsed*1.2);
  }

  drawParticles();

  // HUD
  rounded(16,16,195,34,8,"rgba(5,20,25,.72)");
  ctx.fillStyle="#fff";ctx.font="bold 13px Arial";
  ctx.fillText("KENYA · FREE KICK MODE",28,38);
}

function endShot(text,scored){
  if(!ball)return;
  const x=ball.tx,y=ball.ty;
  ball=null;
  if(scored){
    goals++;
    burst(x,y,"#ffe56c",65);
    burst(450,190,"#fff",30);
  }
  stats();
  say(text);
  shootBtn.disabled=false;
  keeper.target=450;
  keeper.dive=0;
  messageTimer=2;
}

function shoot(){
  if(ball)return;
  shots++;stats();
  shootBtn.disabled=true;

  const p=Number(power.value),c=Number(curve.value);
  const error=(Math.random()-.5)*(p-30)*.13;
  const tx=clamp(aim.x+error,245,655);
  const ty=clamp(aim.y+Math.abs(c)*.08,130,270);

  keeper.target=clamp(tx+(Math.random()-.5)*105,300,600);
  keeper.dive=tx<keeper.x?1:-1;

  ball={
    t:0,tx,ty,curve:c,
    speed:1.05+p/100*.75,
    lift:40+p*.55,
    wallChecked:false,
    keeperChecked:false
  };
  say("シュート！！");
}

function update(dt){
  elapsed+=dt;
  keeper.x+=(keeper.target-keeper.x)*Math.min(1,dt*4.8);

  for(const p of particles){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=100*dt;
    p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);

  if(!ball)return;

  ball.t+=dt*ball.speed;
  const t=ball.t;
  const x=lerp(450,ball.tx,t)+Math.sin(t*Math.PI)*ball.curve*.45;
  const y=lerp(500,ball.ty,t)-Math.sin(t*Math.PI)*ball.lift;

  // 壁のブロック判定
  if(!ball.wallChecked&&t>=.43){
    ball.wallChecked=true;
    const wx=lerp(450,ball.tx,.43)+Math.sin(.43*Math.PI)*ball.curve*.45;
    const wy=lerp(500,ball.ty,.43)-Math.sin(.43*Math.PI)*ball.lift;
    if(wx>375&&wx<540&&wy>325&&wy<385){
      endShot("壁にブロックされた！",false);
      return;
    }
  }

  // キーパーのセーブ判定
  if(!ball.keeperChecked&&t>=.78){
    ball.keeperChecked=true;
    if(Math.abs(x-keeper.x)<43&&y>150&&y<253){
      burst(x,y,"#f4e75b",20);
      endShot("アフロキーパーのスーパーセーブ！🧤",false);
      return;
    }
  }

  if(t>=1){
    if(ball.tx<280||ball.tx>620||ball.ty<145||ball.ty>250){
      endShot("枠外！ もう一度狙おう",false);
    }else{
      endShot("GOOOOAL!! ⚽🇰🇪",true);
    }
  }
}

function reset(){
  goals=0;shots=0;ball=null;particles=[];
  keeper={x:450,target:450,dive:0};
  aim={x:450,y:205};
  shootBtn.disabled=false;
  stats();say("狙う場所を選んでシュートしよう！");
}

canvas.addEventListener("pointerdown",e=>{
  if(ball)return;
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*W/rect.width;
  const y=(e.clientY-rect.top)*H/rect.height;
  aim.x=clamp(x,285,615);
  aim.y=clamp(y,150,240);
  say("照準セット！ パワーとカーブを選んでシュート！");
  draw();
});

power.addEventListener("input",()=>{
  $("powerVal").textContent=power.value+"%";
});
curve.addEventListener("input",()=>{
  const n=Number(curve.value);
  $("curveVal").textContent=(n>0?"+":"")+n;
});
shootBtn.addEventListener("click",shoot);
$("reset").addEventListener("click",reset);

function frame(time){
  const dt=Math.min((time-last)/1000||0,.04);
  last=time;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

stats();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
